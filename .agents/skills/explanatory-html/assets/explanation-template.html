<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>説明HTML</title>
  <style>
    :root{color-scheme:light;--ink:#172033;--muted:#59677d;--line:#d8e0eb;--paper:#fff;--wash:#f3f6fa;--primary:#2457a6;--primary-soft:#eaf1fc;--shadow:0 14px 38px rgba(23,32,51,.09)}
    *{box-sizing:border-box}
    html{background:var(--wash)}
    body{margin:0;color:var(--ink);background:radial-gradient(circle at top right,#dbe8fb 0,transparent 32rem),var(--wash);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.7}
    main{width:min(920px,calc(100% - 32px));margin:32px auto;min-width:0}
    header,section,footer{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
    header{padding:clamp(24px,5vw,46px)}
    section,footer{margin-top:18px;padding:clamp(21px,4vw,32px)}
    h1,h2,h3,p,li,code{overflow-wrap:anywhere}
    h1{margin:8px 0 13px;font-size:clamp(2rem,7vw,3.2rem);line-height:1.16;letter-spacing:-.035em}
    h2{margin:0 0 11px;font-size:clamp(1.35rem,4vw,1.75rem);line-height:1.3}
    h3{margin:0 0 6px;font-size:1.06rem}
    p{margin:.55rem 0}
    ul,ol{padding-left:1.35rem}
    li+li{margin-top:.55rem}
    code{max-width:100%;padding:.14em .38em;border-radius:.34em;background:#edf1f6;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em}
    .eyebrow{margin:0;color:var(--primary);font-size:.84rem;font-weight:800;letter-spacing:.05em}
    .lead{max-width:68ch;color:var(--muted);font-size:1.07rem}
    .summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-top:20px}
    .summary article{min-width:0;padding:15px;border:1px solid var(--line);border-radius:12px;background:var(--primary-soft)}
    .summary strong,.summary span{display:block}
    .summary span{margin-top:3px;color:var(--muted);font-size:.86rem}
    .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:15px}
    .card{min-width:0;padding:17px;border:1px solid var(--line);border-radius:13px;background:#fbfcfe}
    details{margin-top:13px;border:1px solid var(--line);border-radius:11px;background:#fff}
    summary{padding:12px 14px;cursor:pointer;font-weight:750}
    summary:focus-visible{outline:3px solid #86abe4;outline-offset:3px}
    details div{padding:0 14px 13px}
    footer{color:var(--muted);font-size:.88rem}
    @media(max-width:680px){main{width:min(100% - 20px,920px);margin:10px auto 22px}header,section,footer{border-radius:13px}.summary,.cards{grid-template-columns:1fr}}
    @media print{body{background:#fff}main{width:100%;margin:0}header,section,footer{box-shadow:none;break-inside:avoid}}
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow" data-explanation-role="context">説明の位置づけ</p>
      <h1 data-explanation-role="title">説明する内容</h1>
      <p class="lead" data-explanation-role="lead">このページを初めて読む人が、何を理解または判断できるかを短く説明します。</p>
      <div class="summary" aria-label="説明の要点">
        <article>
          <strong>入力</strong>
          <span>何をもとにするか</span>
        </article>
        <article>
          <strong>行うこと</strong>
          <span>何が起きるか</span>
        </article>
        <article>
          <strong>結果</strong>
          <span>何が得られるか</span>
        </article>
      </div>
    </header>

    <section data-explanation-role="overview">
      <h2>最初に知ること</h2>
      <p>結論と、読み手に必要な前提だけを書きます。</p>
    </section>

    <section data-explanation-role="details">
      <h2>内容</h2>
      <div class="cards">
        <article class="card">
          <h3>要点1</h3>
          <p>一つの考えを短い文で説明します。</p>
        </article>
        <article class="card">
          <h3>要点2</h3>
          <p>別の考えはカードを分けて説明します。</p>
        </article>
      </div>
      <details>
        <summary>技術的な詳細を見る</summary>
        <div>
          <p>ID、パス、コマンドなど、必要な人が確認する情報を置きます。</p>
        </div>
      </details>
    </section>

    <section data-explanation-role="decision">
      <h2>人が確認すること</h2>
      <ul>
        <li>事実や前提が正しいか。</li>
        <li>次の行動または判断が明確か。</li>
      </ul>
    </section>

    <footer data-explanation-role="sources">
      正本として確認したファイルや事実を簡潔に示します。
    </footer>
  </main>
</body>
</html>
