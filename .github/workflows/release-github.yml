name: Release GitHub distribution

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish native distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install development dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag, main ancestry, and package version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main --no-tags
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "Release tag ${GITHUB_REF_NAME} does not point to a commit merged into main." >&2
            exit 1
          fi

          package_version="$(bun -e 'console.log((await import("./package.json", { with: { type: "json" } })).default.version)')"
          expected_tag="v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${expected_tag}." >&2
            exit 1
          fi

          successful_runs="$(gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow ci-main.yml \
            --branch main \
            --commit "${GITHUB_SHA}" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq 'length')"
          if [[ "${successful_runs}" != "1" ]]; then
            echo "Main release gate has not succeeded for ${GITHUB_SHA}." >&2
            echo "Wait for the main workflow, then rerun this Release workflow." >&2
            exit 1
          fi

          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; existing Releases are never replaced." >&2
            exit 1
          fi

      - name: Verify tracked project distribution
        run: bun run distribution:check

      - name: Build all GitHub Release assets
        run: bun run package:github

      - name: Create draft Release and upload raw assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "AI-DLC ${GITHUB_REF_NAME}" \
            build/github-release/*

      - name: Publish verified Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
