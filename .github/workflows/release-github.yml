name: Release GitHub distribution

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish native distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"
          cache: false

      - name: Verify tag, main ancestry, and Go version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main --no-tags
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "Release tag ${GITHUB_REF_NAME} does not point to a commit merged into main." >&2
            exit 1
          fi

          release_version="$(go run ./cmd/aidlc --version | awk '{print $2}')"
          expected_tag="v${release_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match Go version ${expected_tag}." >&2
            exit 1
          fi

          successful_runs="$(gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow ci-main.yml \
            --branch main \
            --commit "${GITHUB_SHA}" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq 'length')"
          if [[ "${successful_runs}" != "1" ]]; then
            echo "Main release gate has not succeeded for ${GITHUB_SHA}." >&2
            echo "Wait for the main workflow, then rerun this Release workflow." >&2
            exit 1
          fi

          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; existing Releases are never replaced." >&2
            exit 1
          fi

      - name: Verify tracked Go Project bundle
        run: go run ./cmd/aidlc-dev bundle check --out dist/project

      - name: Build and verify all GitHub Release assets
        run: go run ./cmd/aidlc-dev package-release --out build/github-release

      - name: Create draft Release and upload fixed assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "AI-DLC ${GITHUB_REF_NAME}" \
            build/github-release/SHA256SUMS \
            build/github-release/aidlc-distribution.json \
            build/github-release/aidlc-darwin-amd64 \
            build/github-release/aidlc-darwin-arm64 \
            build/github-release/aidlc-linux-amd64 \
            build/github-release/aidlc-linux-arm64 \
            build/github-release/aidlc-windows-amd64.exe \
            build/github-release/install.sh \
            build/github-release/install.ps1

      - name: Publish verified Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
