name: Main release gate

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test merged main
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node.js for Installer tests
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install development dependencies
        run: bun install --frozen-lockfile

      - name: Verify tracked project distribution
        run: bun run distribution:check

      - name: Run release gate
        run: bun run release:check

  go:
    name: Verify Go migration runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"
          cache: false

      - name: Verify Go formatting
        shell: bash
        run: |
          go_files="$(git ls-files -- '*.go' ':(exclude)work/**')"
          if [[ -z "${go_files}" ]]; then
            echo "No tracked Go files were found." >&2
            exit 1
          fi

          unformatted="$(git ls-files -z -- '*.go' ':(exclude)work/**' | xargs -0 gofmt -l)"
          if [[ -n "${unformatted}" ]]; then
            echo "The following Go files are not formatted:" >&2
            printf '%s\n' "${unformatted}" >&2
            exit 1
          fi

      - name: Vet Go packages
        run: go vet ./...

      - name: Test Go packages
        run: go test -count=1 ./...

      - name: Build non-empty native Go CLI
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p build/go
          go build -trimpath -o build/go/aidlc ./cmd/aidlc
          test -s build/go/aidlc
