name: Main release gate

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test merged main
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node.js for Installer tests
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install development dependencies
        run: bun install --frozen-lockfile

      - name: Verify tracked project distribution
        run: bun run distribution:check

      - name: Run release gate
        run: bun run release:check
