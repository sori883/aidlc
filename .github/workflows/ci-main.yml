name: Main release gate

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test merged main
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"
          cache: false

      - name: Verify Go formatting
        shell: bash
        run: |
          unformatted="$(git ls-files -z -- '*.go' ':(exclude)work/**' | xargs -0 gofmt -l)"
          if [[ -n "${unformatted}" ]]; then
            printf '%s\n' "${unformatted}" >&2
            exit 1
          fi

      - name: Vet Go packages
        run: go vet ./...

      - name: Test Go packages
        run: go test -count=1 ./...

      - name: Race-test Go packages
        run: go test -race -count=1 ./...

      - name: Verify tracked Go Project bundle
        run: go run ./cmd/aidlc-dev bundle check --out dist/project

      - name: Build non-empty native Go CLI
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -o build/go/aidlc ./cmd/aidlc
          test -s build/go/aidlc
